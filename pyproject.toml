[project]
name = "wecom-voice-blaster"
version = "0.1.0"
description = "企业微信客户消息工具（安卓模拟器 + Frida）"
requires-python = ">=3.10"
readme = "README.md"

# 运行时依赖（打包时 pyinstaller 会用 requirements.txt 里的固定下限）
dependencies = [
    "loguru>=0.7.3",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.2",
  "Pillow>=11.0.0",
  "PySide6>=6.8.0",
  "frida==16.7.19",
  "APScheduler>=3.10.4",
]

# `pip install -e .` 之后, 可直接用这两个入口
[project.gui-scripts]
wecom-voice-blaster-gui = "gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
